<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小学校 漢字マスターデータ確認ツール（全1,026字）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Noto+Serif+JP:wght@700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #F5F1EB;
      --surface: #FFFFFF;
      --surface-2: #FAF7F2;
      --ink: #1F1914;
      --ink-sub: #5C5046;
      --muted: #8C7D70;
      --border: #DCD3C7;
      --primary: #B33927;
      --primary-hover: #962E1F;
      --green: #2B6E44;
      --green-bg: #E8F4EC;
      --blue: #1D5494;
      --grid: #E8E2D8;
      --grid-center: #D8CEBE;
      --accent: #E67E22;
      --shadow: 0 2px 10px rgba(31,25,20,0.06), 0 1px 3px rgba(31,25,20,0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--ink);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header - compact single-line */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      flex-wrap: nowrap;
      min-width: 0;
    }
    .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .header-title h1 {
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      display: none; /* hide title when narrow */
    }
    @media (min-width: 900px) {
      .header-title h1 { display: flex; align-items: center; gap: 6px; }
    }
    .grade-selector {
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 600;
      border: 1.5px solid var(--primary);
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink);
      font-family: inherit;
      cursor: pointer;
      outline: none;
    }

    .header-center {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--muted);
      background: var(--surface-2);
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      flex-shrink: 0;
      white-space: nowrap;
    }
    .kbd-hint {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    kbd {
      background: #FFF;
      border: 1px solid var(--border);
      border-bottom: 2px solid var(--muted);
      padding: 1px 4px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 10px;
      font-weight: 600;
      color: var(--ink);
    }

    .header-stats {
      font-size: 12px;
      color: var(--ink-sub);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      flex-shrink: 0;
      flex-wrap: nowrap;
    }
    .stat-pill {
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 16px;
      font-weight: 500;
      font-size: 11px;
      white-space: nowrap;
    }
    .stat-pill strong {
      color: var(--green);
    }

    /* Main layout */
    .app-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar - Kanji list */
    .sidebar {
      width: 200px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .search-box {
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
    }
    .search-input {
      width: 100%;
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 11.5px;
      font-family: inherit;
      background: var(--surface-2);
      outline: none;
    }
    .search-input:focus {
      border-color: var(--blue);
      background: #FFF;
    }
    .filter-tabs {
      display: flex;
      padding: 4px 6px 0;
      gap: 2px;
      border-bottom: 1px solid var(--border);
    }
    .filter-tab {
      font-size: 10px;
      padding: 4px 5px;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      font-family: inherit;
    }
    .filter-tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      font-weight: 600;
    }

    .kanji-grid-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      align-content: start;
    }
    .kanji-item {
      aspect-ratio: 1;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
    }
    .kanji-item:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
      box-shadow: var(--shadow);
    }
    .kanji-item.active {
      background: var(--ink);
      color: var(--surface);
      border-color: var(--ink);
    }
    .kanji-item.active .k-strokes {
      color: #C8BAA6;
    }
    .kanji-item .k-char {
      font-family: 'Noto Serif JP', serif;
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 1px;
    }
    .kanji-item .k-strokes {
      font-size: 8.5px;
      color: var(--muted);
    }
    .kanji-item .status-badge {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
    }
    .kanji-item.checked .status-badge {
      background: var(--green);
    }
    .kanji-item.flagged .status-badge {
      background: var(--accent);
    }

    /* Main Inspection Area */
    .inspector {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Detail Header Card */
    .char-info-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow);
    }
    .char-info-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .big-char-display {
      font-family: 'Noto Serif JP', serif;
      font-size: 40px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1;
      width: 44px;
      text-align: center;
    }
    .meta-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .meta-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .meta-badge {
      font-size: 10px;
      background: #EEE;
      padding: 2px 5px;
      border-radius: 4px;
      color: var(--ink-sub);
      font-weight: normal;
    }
    .meta-grade-badge {
      font-size: 10px;
      background: #E8F0FE;
      color: var(--blue);
      padding: 2px 5px;
      border-radius: 4px;
      font-weight: 600;
    }
    .meta-readings {
      font-size: 11px;
      color: var(--ink-sub);
      display: flex;
      gap: 10px;
    }

    .verification-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-verify {
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface-2);
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }
    .btn-verify:hover {
      background: var(--border);
    }
    .btn-verify.active-ok {
      background: var(--green);
      color: white;
      border-color: var(--green);
    }
    .btn-verify.active-warn {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    /* Workspace: Stage + Controls */
    .stage-wrapper {
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }

    .canvas-box {
      flex: 1;
      min-width: 0;
      aspect-ratio: 1;
      background: #FDFAF6;
      border: 1px solid var(--border);
      border-radius: 12px;
      position: relative;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #preview-svg {
      width: 90%;
      height: 90%;
    }

    /* Controls Panel */
    .controls-panel {
      width: 220px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Style Settings Card */
    .style-toolbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: var(--shadow);
    }
    .style-toolbar-title {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ink-sub);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .style-options-row {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .option-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--ink);
      cursor: pointer;
    }
    .option-item input[type="checkbox"] {
      cursor: pointer;
      accent-color: var(--primary);
    }
    .slider-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: var(--ink-sub);
    }
    .slider-item input[type="range"] {
      width: 75px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .preset-btns {
      display: flex;
      gap: 4px;
    }
    .btn-preset {
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 10.5px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      cursor: pointer;
    }
    .btn-preset.active {
      background: var(--ink);
      color: white;
      border-color: var(--ink);
    }

    /* Navigation toolbar (Kanji switcher) */
    .kanji-nav-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-nav-kanji {
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn-nav-kanji:hover {
      background: var(--surface-2);
      border-color: var(--muted);
    }

    .control-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn-ctrl {
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn-ctrl:hover { background: var(--surface-2); border-color: var(--muted); }
    .btn-primary-ctrl {
      background: var(--ink);
      color: white;
      border-color: var(--ink);
    }
    .btn-primary-ctrl:hover {
      background: #332B24;
    }

    .speed-select {
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 11.5px;
      font-family: inherit;
      background: var(--surface);
      outline: none;
      cursor: pointer;
    }

    .stroke-step-bar {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-sub);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Note Input */
    .note-box {
      margin-top: 2px;
    }
    .note-input {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      font-family: inherit;
      background: var(--surface);
      outline: none;
    }
    .note-input:focus {
      border-color: var(--blue);
    }

    /* Breakdown Thumbnails Section */
    .breakdown-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      box-shadow: var(--shadow);
    }
    .breakdown-title {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .breakdown-grid {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .step-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px;
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .step-card:hover {
      border-color: var(--primary);
    }
    .step-card.active {
      border-color: var(--primary);
      background: #FFF5F4;
    }
    .step-card svg {
      width: 60px;
      height: 60px;
      background: #FDFAF6;
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    .step-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--ink-sub);
    }

    /* ── Narrow window: canvas-only mode (two windows side by side) ── */
    @media (max-width: 640px) {
      header { padding: 4px 8px; gap: 6px; }
      .header-center { display: none; }
      .stat-pill { display: none; }

      .inspector { padding: 4px 6px; gap: 4px; }
      .char-info-card { padding: 4px 8px; }
      .char-info-left { gap: 6px; }
      .big-char-display { font-size: 28px; width: 32px; }
      .meta-readings { display: none; }
      .verification-actions kbd { display: none; }

      .controls-panel { display: none; }
      .breakdown-section { display: none; }

      /* キャンバスをviewport基準で大きく */
      .canvas-box {
        width: calc(100vw - 210px);
        height: calc(100vw - 210px);
        flex: none;
        aspect-ratio: unset;
        max-height: calc(100vh - 90px);
      }
    }
  </style>
</head>
<body>

<header>
  <div class="header-title">
    <h1>漢字マスター確認ツール</h1>
    <select id="grade-selector" class="grade-selector">
      <option value="1">小学1年生 (80字)</option>
      <option value="2">小学2年生 (160字)</option>
      <option value="3">小学3年生 (200字)</option>
      <option value="4">小学4年生 (202字)</option>
      <option value="5">小学5年生 (193字)</option>
      <option value="6">小学6年生 (191字)</option>
      <option value="all">全6学年 (1,026字)</option>
    </select>
  </div>

  <div class="header-center">
    <span class="kbd-hint"><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 字の移動</span>
    <span>｜</span>
    <span class="kbd-hint"><kbd>Enter</kbd> 要確認チェック</span>
    <span>｜</span>
    <span class="kbd-hint"><kbd>Space</kbd> 再生/停止</span>
  </div>

  <div class="header-stats">
    <div class="stat-pill">確認済: <strong id="stat-ok-count">0</strong> / <span id="stat-total-count">80</span>字</div>
    <div class="stat-pill">要確認: <span id="stat-warn-count" style="color:var(--accent); font-weight:bold;">0</span> 字</div>
    <a id="btn-review-list" href="http://localhost:3000/review-list.html" target="_blank"
      class="btn-verify" style="background:#FFF0ED; border-color:var(--accent); color:#B33927; padding:4px 12px; font-size:11.5px; text-decoration:none;">
      ⚠️ 要確認リスト
    </a>
    <a id="btn-batch-adjust" href="http://localhost:3000/batch-adjust.html" target="_blank"
      class="btn-verify" style="background:#8e44ad; border-color:#8e44ad; color:#fff; padding:4px 12px; font-size:11.5px; text-decoration:none;">
      ⚡ 1年一括調整
    </a>
    <button id="btn-export-list" class="btn-verify" style="background:#F5F3F0; border-color:#ccc; color:#555; padding:4px 10px; font-size:11.5px;">
      📋 リストをコピー
    </button>
  </div>
</header>

<div class="app-container">
  <!-- Left Sidebar: Kanji Grid -->
  <aside class="sidebar">
    <div class="search-box">
      <input type="text" id="search-input" class="search-input" placeholder="漢字・画数で検索...">
    </div>
    <div class="filter-tabs">
      <button class="filter-tab active" data-filter="all">すべて (<span id="tab-count-all">80</span>)</button>
      <button class="filter-tab" data-filter="ok">確認OK</button>
      <button class="filter-tab" data-filter="warn">要確認</button>
      <button class="filter-tab" data-filter="uncheck">未確認</button>
    </div>
    <div class="kanji-grid-scroll" id="kanji-grid">
      <!-- Items generated by JS -->
    </div>
  </aside>

  <!-- Right Inspector Area -->
  <main class="inspector">
    <!-- Top Info Card -->
    <div class="char-info-card">
      <div class="char-info-left">
        <div class="big-char-display" id="detail-char">一</div>
        <div class="meta-details">
          <div class="meta-title">
            <span id="detail-char-name">一</span>
            <span class="meta-grade-badge" id="detail-grade">小学1年</span>
            <span class="meta-badge" id="detail-strokes">1 画</span>
            <span class="meta-badge" id="detail-code">U+4E00</span>
          </div>
          <div class="meta-readings">
            <div>画数：<strong id="detail-stroke-text">1 画</strong></div>
            <div>文字コード：<strong id="detail-code-text">U+04E00</strong></div>
          </div>
        </div>
      </div>

      <div class="verification-actions">
        <button class="btn-verify" id="btn-status-ok">
          <span>✅</span> <span>確認OK</span>
        </button>
        <button class="btn-verify" id="btn-status-warn" title="Enterキーで押せます">
          <span>⚠️</span> <span>要確認</span> <kbd>Enter</kbd>
        </button>
        <button class="btn-verify" id="btn-open-editor" title="字形調整エディタで開く" style="margin-left:auto; background:#5B4E42; color:#FDF8F0;">
          ✏️ 字形編集
        </button>
      </div>
    </div>

    <!-- Workspace: Stage + Controls -->
    <div class="stage-wrapper">
      <div class="canvas-box">
        <svg id="preview-svg" viewBox="0 0 109 109">
          <!-- 田 grid (マス目の補助線) -->
          <rect x="3" y="3" width="103" height="103" fill="none" stroke="var(--grid-center)" stroke-width="0.8"/>
          <line x1="54.5" y1="3" x2="54.5" y2="106" stroke="var(--grid-center)" stroke-width="0.6"/>
          <line x1="3" y1="54.5" x2="106" y2="54.5" stroke="var(--grid-center)" stroke-width="0.6"/>
          <line x1="3" y1="3" x2="106" y2="106" stroke="var(--grid)" stroke-width="0.4" stroke-dasharray="2,3"/>
          <line x1="106" y1="3" x2="3" y2="106" stroke="var(--grid)" stroke-width="0.4" stroke-dasharray="2,3"/>

          <!-- Guide Layer (判定と100%一致する薄いお手本なぞり線) -->
          <g id="guide-layer" fill="none" stroke="#D8CEBE" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"></g>

          <!-- Numbers Layer (書き順番号) -->
          <g id="numbers-layer" font-size="5.2" fill="#7C6D60" font-family="sans-serif" font-weight="bold" opacity="0.85"></g>

          <!-- Completed Strokes Layer (清書線：深みのある墨色) -->
          <g id="done-layer" fill="none" stroke="#1B1612" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"></g>

          <!-- Active Animating Stroke Layer (アニメーション中の朱色筆線) -->
          <g id="active-layer" fill="none" stroke="#B33927" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"></g>
        </svg>
      </div>

      <div class="controls-panel">
        <!-- Kanji Navigation Buttons -->
        <div class="kanji-nav-bar">
          <button class="btn-nav-kanji" id="btn-prev-kanji" title="左矢印キー (←)">
            <span>◀ 前の漢字</span> <kbd>←</kbd>
          </button>
          <button class="btn-nav-kanji" id="btn-next-kanji" title="次の漢字 ▶</span> <kbd>→</kbd>
          </button>
        </div>

        <!-- Style Settings -->
        <div class="style-toolbar">
          <div class="style-toolbar-title">
            <span>🎨 線の太さ・手本スタイル</span>
            <div class="preset-btns">
              <button class="btn-preset active" data-style="pencil">標準 (5.2px)</button>
              <button class="btn-preset" data-style="brush">太筆 (6.4px)</button>
              <button class="btn-preset" data-style="thin">細め (3.8px)</button>
            </div>
          </div>
          <div class="style-options-row">
            <label class="option-item">
              <input type="checkbox" id="chk-guide-strokes" checked>
              <span>なぞり線</span>
            </label>
            <div class="slider-item">
              <span>濃さ:</span>
              <input type="range" id="rng-guide-opacity" min="0.2" max="1.0" step="0.1" value="0.85">
            </div>
            <label class="option-item">
              <input type="checkbox" id="chk-numbers" checked>
              <span>画数番号</span>
            </label>
            <div class="slider-item">
              <span>太さ:</span>
              <input type="range" id="rng-stroke-width" min="3.0" max="7.5" step="0.4" value="5.2">
              <span id="stroke-width-val" style="font-weight:bold; width:34px;">5.2px</span>
            </div>
          </div>
        </div>

        <div class="stroke-step-bar">
          <span>表示中の画:</span>
          <span id="step-indicator" style="color:var(--primary); font-size:14.5px;">1 / 1 画</span>
        </div>

        <div class="control-row">
          <button class="btn-ctrl btn-primary-ctrl" id="btn-play-all" title="Spaceキーでも再生できます">
            ▶ 全画を自動再生 <kbd style="background:#4A3F35; color:#FFF; border-color:#2A231C;">Space</kbd>
          </button>
          <button class="btn-ctrl" id="btn-show-all">全画を表示</button>
          <button class="btn-ctrl" id="btn-reset">↺ リセット</button>
          <select id="speed-select" class="speed-select">
            <option value="1.5">速度: はやい (1.5x)</option>
            <option value="1.0" selected>速度: ふつう (1.0x)</option>
            <option value="0.6">速度: ゆっくり (0.6x)</option>
          </select>
        </div>

        <div class="control-row">
          <button class="btn-ctrl" id="btn-prev-stroke">◀ 前の一画</button>
          <button class="btn-ctrl" id="btn-next-stroke">次の一画 ▶</button>
        </div>

        <div class="note-box">
          <label style="font-size:11px; color:var(--muted); margin-bottom:3px; display:block;">検査メモ（気になった点など）:</label>
          <input type="text" id="kanji-note" class="note-input" placeholder="例: 1画目の払いが教科書と少し異なる、など">
        </div>
      </div>
    </div>

    <!-- Breakdown Section -->
    <div class="breakdown-section">
      <div class="breakdown-title">
        <span>📑 書き順ステップ分解（1画ごとの進行状態）</span>
      </div>
      <div class="breakdown-grid" id="breakdown-grid">
        <!-- Breakdown cards generated by JS -->
      </div>
    </div>
  </main>
</div>

<!-- Load All 6 Grades Master Data -->
<script src="../data/kanji/all_grades.js"></script>

<script>
// ── App State ──────────────────────────────────────────────────────────
let allMasterData = window.ALL_GRADES_KANJI || {};
let currentGrade = localStorage.getItem('viewer_grade') || '1';
let kanjiData = {};
let currentKey = localStorage.getItem('viewer_char') || '一';
let currentStrokeIndex = 0;
let isPlaying = false;
let playAnimTimer = null;
let reviewStatus = JSON.parse(localStorage.getItem('kanji_review_status_all') || '{}');

const NS = 'http://www.w3.org/2000/svg';

// ── DOM References ─────────────────────────────────────────────────────
const gradeSelector    = document.getElementById('grade-selector');
const kanjiGrid        = document.getElementById('kanji-grid');
const searchInput      = document.getElementById('search-input');
const filterTabs       = document.querySelectorAll('.filter-tab');
const tabCountAll      = document.getElementById('tab-count-all');
const statOkCount      = document.getElementById('stat-ok-count');
const statWarnCount    = document.getElementById('stat-warn-count');
const statTotalCount   = document.getElementById('stat-total-count');

const detailChar       = document.getElementById('detail-char');
const detailCharName   = document.getElementById('detail-char-name');
const detailGrade      = document.getElementById('detail-grade');
const detailStrokes    = document.getElementById('detail-strokes');
const detailCode       = document.getElementById('detail-code');
const detailStrokeText = document.getElementById('detail-stroke-text');
const detailCodeText   = document.getElementById('detail-code-text');
const btnStatusOk      = document.getElementById('btn-status-ok');
const btnStatusWarn    = document.getElementById('btn-status-warn');
const kanjiNote        = document.getElementById('kanji-note');

const btnPrevKanji     = document.getElementById('btn-prev-kanji');
const btnNextKanji     = document.getElementById('btn-next-kanji');

const guideLayer       = document.getElementById('guide-layer');
const numbersLayer     = document.getElementById('numbers-layer');
const doneLayer        = document.getElementById('done-layer');
const activeLayer      = document.getElementById('active-layer');

const chkGuideStrokes  = document.getElementById('chk-guide-strokes');
const rngGuideOpacity  = document.getElementById('rng-guide-opacity');
const chkNumbers       = document.getElementById('chk-numbers');
const rngStrokeWidth   = document.getElementById('rng-stroke-width');
const strokeWidthVal   = document.getElementById('stroke-width-val');
const presetBtns       = document.querySelectorAll('.btn-preset');

const stepIndicator    = document.getElementById('step-indicator');
const btnPlayAll       = document.getElementById('btn-play-all');
const btnShowAll       = document.getElementById('btn-show-all');
const btnReset         = document.getElementById('btn-reset');
const btnPrevStroke    = document.getElementById('btn-prev-stroke');
const btnNextStroke    = document.getElementById('btn-next-stroke');
const speedSelect      = document.getElementById('speed-select');
const breakdownGrid    = document.getElementById('breakdown-grid');

// ── Switch Grade Data ──────────────────────────────────────────────────
function switchGrade(grade, preferredChar = null) {
  currentGrade = grade;
  gradeSelector.value = grade;
  localStorage.setItem('viewer_grade', grade);
  kanjiData = {};

  const keys = Object.keys(allMasterData);
  keys.forEach(k => {
    const item = allMasterData[k];
    if (grade === 'all' || String(item.grade) === String(grade)) {
      kanjiData[k] = item;
    }
  });

  const availableKeys = Object.keys(kanjiData);
  tabCountAll.textContent = availableKeys.length;
  statTotalCount.textContent = availableKeys.length;

  if (availableKeys.length > 0) {
    if (preferredChar && kanjiData[preferredChar]) {
      currentKey = preferredChar;
    } else if (!kanjiData[currentKey]) {
      currentKey = availableKeys[0];
    }

    // Restore saved filter tab
    const savedFilter = localStorage.getItem('viewer_filter') || 'all';
    filterTabs.forEach(t => t.classList.remove('active'));
    const targetTab = document.querySelector(`.filter-tab[data-filter="${savedFilter}"]`);
    if (targetTab) {
      targetTab.classList.add('active');
    } else {
      document.querySelector('.filter-tab[data-filter="all"]').classList.add('active');
    }

    renderSidebar(savedFilter);
    selectKanji(currentKey);
  }
}

// ── Get Visible Kanji Keys (filtered) ──────────────────────────────────
function getVisibleKeys() {
  const filter = document.querySelector('.filter-tab.active')?.dataset.filter || 'all';
  const query = searchInput.value.trim().toLowerCase();
  const keys = Object.keys(kanjiData);

  return keys.filter(k => {
    const item = kanjiData[k];
    const status = reviewStatus[k] || { state: 'none', note: '' };

    if (filter === 'ok' && status.state !== 'ok') return false;
    if (filter === 'warn' && status.state !== 'warn') return false;
    if (filter === 'uncheck' && status.state !== 'none') return false;

    if (query) {
      const matchChar = k.includes(query);
      const matchStrokes = String(item.strokeCount) === query;
      if (!matchChar && !matchStrokes) return false;
    }
    return true;
  });
}

// ── Navigation (Previous / Next Kanji) ──────────────────────────────────
function navigateKanji(direction) {
  const visibleKeys = getVisibleKeys();
  if (visibleKeys.length === 0) return;

  let idx = visibleKeys.indexOf(currentKey);
  if (idx === -1) {
    idx = 0;
  } else {
    idx = (idx + direction + visibleKeys.length) % visibleKeys.length;
  }

  selectKanji(visibleKeys[idx]);

  setTimeout(() => {
    const activeEl = document.querySelector('.kanji-item.active');
    if (activeEl) {
      activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }, 50);
}

// ── Render Sidebar Grid ────────────────────────────────────────────────
function renderSidebar(filter = 'all', query = '') {
  kanjiGrid.innerHTML = '';
  const visibleKeys = getVisibleKeys();

  visibleKeys.forEach(k => {
    const item = kanjiData[k];
    const status = reviewStatus[k] || { state: 'none', note: '' };

    const card = document.createElement('div');
    card.className = `kanji-item ${k === currentKey ? 'active' : ''} ${status.state === 'ok' ? 'checked' : ''} ${status.state === 'warn' ? 'flagged' : ''}`;
    card.innerHTML = `
      <div class="status-badge"></div>
      <div class="k-char">${k}</div>
      <div class="k-strokes">${item.strokeCount}画</div>
    `;
    card.onclick = () => selectKanji(k);
    kanjiGrid.appendChild(card);
  });

  updateStats();
}

function updateStats() {
  const keys = Object.keys(kanjiData);
  let ok = 0;
  let warn = 0;
  keys.forEach(k => {
    const s = reviewStatus[k];
    if (s?.state === 'ok') ok++;
    if (s?.state === 'warn') warn++;
  });
  statOkCount.textContent = ok;
  statWarnCount.textContent = warn;
}

// ── Select Kanji ───────────────────────────────────────────────────────
function selectKanji(char) {
  stopAnimation();
  currentKey = char;
  localStorage.setItem('viewer_char', char);
  currentStrokeIndex = 0;

  const data = kanjiData[char];
  if (!data) return;

  detailChar.textContent = char;
  detailCharName.textContent = char;
  detailGrade.textContent = `小学${data.grade}年`;
  detailStrokes.textContent = `${data.strokeCount} 画`;
  detailCode.textContent = `U+${data.codePoint.toUpperCase()}`;
  detailStrokeText.textContent = `${data.strokeCount} 画`;
  detailCodeText.textContent = `U+${data.codePoint.toUpperCase()}`;

  const status = reviewStatus[char] || { state: 'none', note: '' };
  btnStatusOk.className = `btn-verify ${status.state === 'ok' ? 'active-ok' : ''}`;
  btnStatusWarn.className = `btn-verify ${status.state === 'warn' ? 'active-warn' : ''}`;
  kanjiNote.value = status.note || '';

  renderLayers();
  renderBreakdown();

  document.querySelectorAll('.kanji-item').forEach(el => {
    el.classList.toggle('active', el.querySelector('.k-char').textContent === char);
  });
}

// ── Render SVG Layers ──────────────────────────────────────────────────
function renderLayers() {
  const data = kanjiData[currentKey];
  if (!data) return;
  guideLayer.innerHTML = '';
  numbersLayer.innerHTML = '';
  doneLayer.innerHTML = '';
  activeLayer.innerHTML = '';

  const strokeWidth = parseFloat(rngStrokeWidth.value) || 5.2;
  guideLayer.setAttribute('stroke-width', strokeWidth);
  doneLayer.setAttribute('stroke-width', strokeWidth);
  activeLayer.setAttribute('stroke-width', strokeWidth + 0.3);

  // 1. Guide strokes
  guideLayer.style.display = chkGuideStrokes.checked ? 'block' : 'none';
  guideLayer.style.opacity = rngGuideOpacity.value;
  if (chkGuideStrokes.checked) {
    data.paths.forEach(d => {
      const p = document.createElementNS(NS, 'path');
      p.setAttribute('d', d);
      guideLayer.appendChild(p);
    });
  }

  // 2. Numbers
  numbersLayer.style.display = chkNumbers.checked ? 'block' : 'none';
  if (chkNumbers.checked && data.numbers) {
    data.numbers.forEach(n => {
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', n.x);
      t.setAttribute('y', n.y);
      t.textContent = n.num;
      numbersLayer.appendChild(t);
    });
  }

  // 3. Completed strokes
  for (let i = 0; i < currentStrokeIndex; i++) {
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', data.paths[i]);
    doneLayer.appendChild(p);
  }

  // 4. Step indicator
  stepIndicator.textContent = `${currentStrokeIndex} / ${data.strokeCount} 画`;
}

// ── Render Breakdown Thumbnails ────────────────────────────────────────
function renderBreakdown() {
  const data = kanjiData[currentKey];
  if (!data) return;
  breakdownGrid.innerHTML = '';
  const strokeWidth = parseFloat(rngStrokeWidth.value) || 5.2;

  for (let step = 1; step <= data.strokeCount; step++) {
    const card = document.createElement('div');
    card.className = `step-card ${step === currentStrokeIndex ? 'active' : ''}`;
    
    let strokesSvg = '';
    for (let s = 0; s < step; s++) {
      const isLatest = (s === step - 1);
      strokesSvg += `<path d="${data.paths[s]}" fill="none" stroke="${isLatest ? '#B33927' : '#1B1612'}" stroke-width="${isLatest ? strokeWidth + 0.2 : strokeWidth}" stroke-linecap="round" stroke-linejoin="round"/>`;
    }

    card.innerHTML = `
      <svg viewBox="0 0 109 109">
        <rect x="3" y="3" width="103" height="103" fill="none" stroke="#EFEBE4" stroke-width="0.8"/>
        <line x1="54.5" y1="3" x2="54.5" y2="106" stroke="#EFEBE4" stroke-width="0.6"/>
        <line x1="3" y1="54.5" x2="106" y2="54.5" stroke="#EFEBE4" stroke-width="0.6"/>
        ${strokesSvg}
      </svg>
      <span class="step-label">${step}画目</span>
    `;

    card.onclick = () => {
      stopAnimation();
      currentStrokeIndex = step;
      renderLayers();
      updateBreakdownActive();
    };

    breakdownGrid.appendChild(card);
  }
}

function updateBreakdownActive() {
  document.querySelectorAll('.step-card').forEach((el, idx) => {
    el.classList.toggle('active', idx + 1 === currentStrokeIndex);
  });
}

// ── Animate Single Stroke ──────────────────────────────────────────────
function animateStroke(strokeIdx, speedMultiplier = 1.0) {
  return new Promise(resolve => {
    const data = kanjiData[currentKey];
    activeLayer.innerHTML = '';

    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', data.paths[strokeIdx]);
    activeLayer.appendChild(p);

    const len = p.getTotalLength();
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
    p.getBoundingClientRect();

    const duration = (Math.max(380, len * 11) / speedMultiplier);
    p.style.transition = `stroke-dashoffset ${duration}ms ease`;
    p.style.strokeDashoffset = '0';

    playAnimTimer = setTimeout(() => {
      activeLayer.innerHTML = '';
      const doneP = document.createElementNS(NS, 'path');
      doneP.setAttribute('d', data.paths[strokeIdx]);
      doneLayer.appendChild(doneP);

      currentStrokeIndex = strokeIdx + 1;
      stepIndicator.textContent = `${currentStrokeIndex} / ${data.strokeCount} 画`;
      updateBreakdownActive();
      resolve();
    }, duration + 50);
  });
}

// ── Full Animation Play ────────────────────────────────────────────────
async function playAllStrokes() {
  if (isPlaying) {
    stopAnimation();
    return;
  }

  isPlaying = true;
  btnPlayAll.innerHTML = '⏸ 一時停止 <kbd style="background:#4A3F35; color:#FFF; border-color:#2A231C;">Space</kbd>';
  btnPlayAll.classList.remove('btn-primary-ctrl');

  const data = kanjiData[currentKey];
  if (currentStrokeIndex >= data.strokeCount) {
    currentStrokeIndex = 0;
    renderLayers();
  }

  const speed = parseFloat(speedSelect.value) || 1.0;

  while (currentStrokeIndex < data.strokeCount && isPlaying) {
    await animateStroke(currentStrokeIndex, speed);
    await new Promise(r => { playAnimTimer = setTimeout(r, 160 / speed); });
  }

  stopAnimation();
}

function stopAnimation() {
  isPlaying = false;
  clearTimeout(playAnimTimer);
  btnPlayAll.innerHTML = '▶ 全画を自動再生 <kbd style="background:#4A3F35; color:#FFF; border-color:#2A231C;">Space</kbd>';
  btnPlayAll.classList.add('btn-primary-ctrl');
}

// ── Event Handlers ─────────────────────────────────────────────────────
gradeSelector.onchange = (e) => switchGrade(e.target.value);

btnPlayAll.onclick = playAllStrokes;

btnShowAll.onclick = () => {
  stopAnimation();
  const data = kanjiData[currentKey];
  currentStrokeIndex = data.strokeCount;
  renderLayers();
  updateBreakdownActive();
};

btnReset.onclick = () => {
  stopAnimation();
  currentStrokeIndex = 0;
  renderLayers();
  updateBreakdownActive();
};

document.getElementById('btn-open-editor').onclick = () => {
  const data = kanjiData[currentKey];
  if (data) {
    window.open(`stroke-editor.html?char=${encodeURIComponent(currentKey)}&grade=${data.grade}`, '_blank');
  }
};

btnPrevStroke.onclick = () => {
  stopAnimation();
  if (currentStrokeIndex > 0) {
    currentStrokeIndex--;
    renderLayers();
    updateBreakdownActive();
  }
};

btnNextStroke.onclick = async () => {
  stopAnimation();
  const data = kanjiData[currentKey];
  if (currentStrokeIndex < data.strokeCount) {
    const speed = parseFloat(speedSelect.value) || 1.0;
    await animateStroke(currentStrokeIndex, speed);
  }
};

btnPrevKanji.onclick = () => navigateKanji(-1);
btnNextKanji.onclick = () => navigateKanji(1);

// Toolbar Settings Handlers
chkGuideStrokes.onchange = renderLayers;
rngGuideOpacity.oninput = () => {
  guideLayer.style.opacity = rngGuideOpacity.value;
};
chkNumbers.onchange = renderLayers;

rngStrokeWidth.oninput = () => {
  const val = rngStrokeWidth.value;
  strokeWidthVal.textContent = `${val}px`;
  renderLayers();
  renderBreakdown();
};

// Preset Buttons
presetBtns.forEach(btn => {
  btn.onclick = () => {
    presetBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    let width = 5.2;
    if (btn.dataset.style === 'brush') width = 6.4;
    if (btn.dataset.style === 'thin') width = 3.8;
    rngStrokeWidth.value = width;
    strokeWidthVal.textContent = `${width}px`;
    renderLayers();
    renderBreakdown();
  };
});

// Search & Filter
searchInput.oninput = (e) => {
  const activeFilter = document.querySelector('.filter-tab.active').dataset.filter;
  renderSidebar(activeFilter, e.target.value);
};

filterTabs.forEach(tab => {
  tab.onclick = () => {
    filterTabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    localStorage.setItem('viewer_filter', tab.dataset.filter);
    renderSidebar(tab.dataset.filter, searchInput.value);
  };
});

// ── Status Sync with Local File (via server) ───────────────────────────
const API_URL = 'http://localhost:3000/api/review-status';

async function syncStatusToServer(char, state, note) {
  try {
    await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ char, state, note })
    });
  } catch (e) {
    // Fallback silently if offline
  }
}

// Status Toggle (Clicking same button toggles to 'none' to cancel)
function saveStatus(state, autoAdvance = false) {
  const current = reviewStatus[currentKey] || { state: 'none', note: '' };
  const newState = (current.state === state) ? 'none' : state;
  current.state = newState;
  current.note = kanjiNote.value;

  if (newState === 'none' && !current.note) {
    delete reviewStatus[currentKey];
  } else {
    reviewStatus[currentKey] = current;
  }

  localStorage.setItem('kanji_review_status_all', JSON.stringify(reviewStatus));
  syncStatusToServer(currentKey, newState, current.note);

  btnStatusOk.className = `btn-verify ${newState === 'ok' ? 'active-ok' : ''}`;
  btnStatusWarn.className = `btn-verify ${newState === 'warn' ? 'active-warn' : ''}`;

  renderSidebar(document.querySelector('.filter-tab.active').dataset.filter, searchInput.value);

  if (autoAdvance && newState === 'ok') {
    setTimeout(() => navigateKanji(1), 120);
  }
}

btnStatusOk.onclick = () => saveStatus('ok');
btnStatusWarn.onclick = () => saveStatus('warn');
kanjiNote.onchange = () => {
  const current = reviewStatus[currentKey] || { state: 'none', note: '' };
  current.note = kanjiNote.value;
  reviewStatus[currentKey] = current;
  localStorage.setItem('kanji_review_status_all', JSON.stringify(reviewStatus));
  syncStatusToServer(currentKey, current.state, current.note);
};

// ── Keyboard Shortcuts ─────────────────────────────────────────────────
window.addEventListener('keydown', (e) => {
  const isInputActive = (document.activeElement === searchInput || document.activeElement === kanjiNote);

  if (e.key === 'Enter') {
    if (isInputActive) {
      document.activeElement.blur();
    }
    e.preventDefault();
    saveStatus('warn');
    return;
  }

  if ((e.key === 'ArrowLeft') && !isInputActive) {
    e.preventDefault();
    navigateKanji(-1);
    return;
  }

  if ((e.key === 'ArrowRight') && !isInputActive) {
    e.preventDefault();
    navigateKanji(1);
    return;
  }

  if (e.key === 'ArrowUp' && !isInputActive) {
    e.preventDefault();
    const cols = parseInt(getComputedStyle(document.getElementById('kanji-grid')).gridTemplateColumns.split(' ').length) || 4;
    navigateKanji(-cols);
    return;
  }

  if (e.key === 'ArrowDown' && !isInputActive) {
    e.preventDefault();
    const cols = parseInt(getComputedStyle(document.getElementById('kanji-grid')).gridTemplateColumns.split(' ').length) || 4;
    navigateKanji(cols);
    return;
  }

  if (e.key === ' ' && !isInputActive) {
    e.preventDefault();
    playAllStrokes();
    return;
  }
});

// ── Open Stroke Editor ──────────────────────────────────────────────────
const btnOpenEditor = document.getElementById('btn-open-editor');
if (btnOpenEditor) {
  btnOpenEditor.onclick = () => {
    window.open(`stroke-editor.html?kanji=${encodeURIComponent(currentKey)}`, '_blank');
  };
}

// ── Export Checked Kanji List ──────────────────────────────────────────
const btnExportList = document.getElementById('btn-export-list');
btnExportList.onclick = () => {
  const warnList = [];
  const okList = [];

  Object.keys(reviewStatus).forEach(k => {
    const s = reviewStatus[k];
    const item = allMasterData[k] || {};
    const gradeText = item.grade ? `小${item.grade}` : '';

    if (s?.state === 'warn' || s?.note) {
      warnList.push(`・【${k}】(${gradeText}) ${s.note ? 'メモ: ' + s.note : '要確認'}`);
    } else if (s?.state === 'ok') {
      okList.push(k);
    }
  });

  let text = `【要確認・気になった漢字リスト】（合計 ${warnList.length} 字）\n`;
  if (warnList.length > 0) {
    text += warnList.join('\n') + '\n\n';
  } else {
    text += '（現在、要確認としてチェックされた文字はありません）\n\n';
  }
  text += `【確認OK済】: ${okList.length} 字 (${okList.join(' ')})`;

  navigator.clipboard.writeText(text).then(() => {
    alert(text + '\n\n✅ リストをクリップボードにコピーしました！\nAntigravityはファイル（data/review_status.json）からも自動で読み取れます！');
  }).catch(() => {
    prompt('以下の内容をコピーしてチャットに貼り付けてください：', text);
  });
};

// ── Init (Load from server file or localStorage) ───────────────────────
async function initApp() {
  try {
    const res = await fetch(API_URL);
    if (res.ok) {
      const serverStatus = await res.json();
      reviewStatus = Object.assign({}, reviewStatus, serverStatus);
      // Also sync back any localStorage data to server
      if (Object.keys(reviewStatus).length > 0) {
        fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fullSync: reviewStatus })
        });
      }
    }
  } catch (e) {
    // offline
  }

  switchGrade(currentGrade, currentKey);
}

initApp();
</script>
