    function addPlacedPoint(svgX, svgY) {
      placedPoints.push({ x: svgX, y: svgY });
      document.getElementById('point-count').textContent = placedPoints.length + '点';
      renderPointPreview();
    }

    function undoLastPoint() {
      if (placedPoints.length > 0) {
        placedPoints.pop();
        document.getElementById('point-count').textContent = placedPoints.length + '点';
        renderPointPreview();
      }
    }

    function renderPointPreview() {
      clearPointPreview();
      const layer = document.getElementById('controls-layer');
      const NS = 'http://www.w3.org/2000/svg';

      // Draw smooth curve preview if 2+ points
      if (placedPoints.length >= 2) {
        const segments = buildCatmullRomSegments(placedPoints);
        const d = buildSvgPath(segments);
        const path = document.createElementNS(NS, 'path');
        path.setAttribute('d', d);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', '#7c3aed');
        path.setAttribute('stroke-width', 3.5 / zoomLevel);
        path.setAttribute('stroke-opacity', '0.7');
        path.setAttribute('stroke-linecap', 'round');
        path.setAttribute('stroke-linejoin', 'round');
        path.classList.add('point-preview-el');
        layer.appendChild(path);
      }

      // Draw dots for each point
      placedPoints.forEach((p, i) => {
        const circle = document.createElementNS(NS, 'circle');
        circle.setAttribute('cx', p.x);
        circle.setAttribute('cy', p.y);
        circle.setAttribute('r', 3.5 / zoomLevel);
        circle.setAttribute('fill', i === 0 ? '#059669' : '#7c3aed');
        circle.setAttribute('stroke', '#fff');
        circle.setAttribute('stroke-width', 1.2 / zoomLevel);
        circle.classList.add('point-preview-el');
        layer.appendChild(circle);

        // Number label
        const text = document.createElementNS(NS, 'text');
        text.setAttribute('x', p.x + 5 / zoomLevel);
        text.setAttribute('y', p.y - 5 / zoomLevel);
        text.setAttribute('font-size', 7 / zoomLevel);
        text.setAttribute('fill', '#7c3aed');
        text.setAttribute('font-weight', 'bold');
        text.setAttribute('pointer-events', 'none');
        text.textContent = i + 1;
        text.classList.add('point-preview-el');
        layer.appendChild(text);
      });
    }

    function clearPointPreview() {
      document.querySelectorAll('.point-preview-el').forEach(el => el.remove());
    }

    function confirmPointPlacement() {
      if (placedPoints.length < 2) {
        showToast('2点以上配置してください');
        return;
      }

      const segments = buildCatmullRomSegments(placedPoints);

      if (currentStrokeIndex >= 0 && currentStrokeIndex < parsedStrokes.length) {
        parsedStrokes[currentStrokeIndex] = segments;
        pushHistory();
        updateUI();
        showToast(`画 ${currentStrokeIndex + 1} を生成 (${segments.length - 1}セグメント) — 制御点で微調整できます`);
      }

      exitPointPlaceMode();
    }

    function buildCatmullRomSegments(points) {
      const segments = [];
      segments.push({ type: 'M', x: points[0].x, y: points[0].y });

      for (let i = 0; i < points.length - 1; i++) {
        const p0 = points[Math.max(0, i - 1)];
        const p1 = points[i];
        const p2 = points[i + 1];
        const p3 = points[Math.min(points.length - 1, i + 2)];

        const cp1x = p1.x + (p2.x - p0.x) / 6;
        const cp1y = p1.y + (p2.y - p0.y) / 6;
        const cp2x = p2.x - (p3.x - p1.x) / 6;
        const cp2y = p2.y - (p3.y - p1.y) / 6;

        segments.push({
          type: 'c',
          abs_cp1x: cp1x, abs_cp1y: cp1y,
          abs_cp2x: cp2x, abs_cp2y: cp2y,
          abs_x: p2.x, abs_y: p2.y
        });
      }

      return segments;
    }

    function startDrawing(svgX, svgY) {
      isDrawing = true;
      drawTrail = [{x: svgX, y: svgY}];
      
      // Show live trail as SVG path
      let trailPath = document.getElementById('draw-trail-path');
      if (!trailPath) {
        trailPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        trailPath.id = 'draw-trail-path';
        trailPath.setAttribute('fill', 'none');
        trailPath.setAttribute('stroke', '#059669');
        trailPath.setAttribute('stroke-linecap', 'round');
        trailPath.setAttribute('stroke-linejoin', 'round');
        trailPath.style.pointerEvents = 'none';
        document.getElementById('stroke-active-layer').appendChild(trailPath);
      }
      trailPath.setAttribute('stroke-width', 3 / zoomLevel);
      trailPath.setAttribute('stroke-opacity', '0.7');
      trailPath.setAttribute('d', `M${svgX},${svgY}`);
    }
    
    function continueDrawing(svgX, svgY) {
      if (!isDrawing) return;
      
      // Only add if moved enough (avoid duplicates)
      const last = drawTrail[drawTrail.length - 1];
      const dist = Math.hypot(svgX - last.x, svgY - last.y);
      if (dist < 0.3 / zoomLevel) return; // Skip if too close
      
      drawTrail.push({x: svgX, y: svgY});
      
      // Update live trail
      const trailPath = document.getElementById('draw-trail-path');
      if (trailPath) {
        let d = `M${drawTrail[0].x.toFixed(1)},${drawTrail[0].y.toFixed(1)}`;
        for (let i = 1; i < drawTrail.length; i++) {
          d += `L${drawTrail[i].x.toFixed(1)},${drawTrail[i].y.toFixed(1)}`;
        }
        trailPath.setAttribute('d', d);
      }
    }
    
    function finishDrawing() {
      if (!isDrawing || drawTrail.length < 2) {
        isDrawing = false;
        drawTrail = [];
        return;
      }
      isDrawing = false;
      
      // Remove trail visual
      const trailPath = document.getElementById('draw-trail-path');
      if (trailPath) trailPath.remove();
      
      // Simplify with RDP then fit bezier curves
      const simplified = rdpSimplifyDraw(drawTrail, 1.0);
      
      if (simplified.length < 2) return;
      
      // Build stroke from simplified points using Catmull-Rom
      const segments = [];
      segments.push({ type: 'M', x: simplified[0].x, y: simplified[0].y });
      
      for (let i = 0; i < simplified.length - 1; i++) {
        const p0 = simplified[Math.max(0, i - 1)];
        const p1 = simplified[i];
        const p2 = simplified[i + 1];
        const p3 = simplified[Math.min(simplified.length - 1, i + 2)];
        
        // Catmull-Rom → Cubic Bezier
        const cp1x = p1.x + (p2.x - p0.x) / 6;
        const cp1y = p1.y + (p2.y - p0.y) / 6;
        const cp2x = p2.x - (p3.x - p1.x) / 6;
        const cp2y = p2.y - (p3.y - p1.y) / 6;
        
        segments.push({
          type: 'c',
          abs_cp1x: cp1x, abs_cp1y: cp1y,
          abs_cp2x: cp2x, abs_cp2y: cp2y,
          abs_x: p2.x, abs_y: p2.y
        });
      }
      
      // Replace current stroke
      if (currentStrokeIndex >= 0 && currentStrokeIndex < parsedStrokes.length) {
        parsedStrokes[currentStrokeIndex] = segments;
        pushHistory();
        updateUI();
        showToast(`画 ${currentStrokeIndex + 1} を描画しました (${segments.length - 1}セグメント) — 制御点で微調整可能`);
      }
      
      drawTrail = [];
    }
    
    // Ramer-Douglas-Peucker simplification for freehand trails
    function rdpSimplifyDraw(points, epsilon) {
      if (points.length <= 2) return points.slice();
      
      const first = points[0], last = points[points.length - 1];
      let maxDist = 0, maxIdx = 0;
      
      for (let i = 1; i < points.length - 1; i++) {
        const d = ptToLineDist(points[i], first, last);
        if (d > maxDist) { maxDist = d; maxIdx = i; }
      }
      
      if (maxDist > epsilon) {
        const left = rdpSimplifyDraw(points.slice(0, maxIdx + 1), epsilon);
        const right = rdpSimplifyDraw(points.slice(maxIdx), epsilon);
        return left.slice(0, -1).concat(right);
      } else {
        return [first, last];
      }
    }
    
    function ptToLineDist(p, a, b) {
      const dx = b.x - a.x, dy = b.y - a.y;
      const lenSq = dx*dx + dy*dy;
      if (lenSq === 0) return Math.hypot(p.x - a.x, p.y - a.y);
      const t = Math.max(0, Math.min(1, ((p.x-a.x)*dx + (p.y-a.y)*dy) / lenSq));
      return Math.hypot(p.x - (a.x + t*dx), p.y - (a.y + t*dy));
    }

    function setupEventListeners() {
      const svgEditor = document.getElementById('main-editor');

      // Right-click or Alt+Left-click or Middle-click drag to pan
      svgEditor.addEventListener('mousedown', (e) => {
        // Point-place mode: left click to add point
        if (isPointPlaceMode && e.button === 0 && !e.altKey) {
          e.preventDefault();
          const pt = getMousePosition(e);
          addPlacedPoint(pt.x, pt.y);
          return;
        }
        // Draw mode: start freehand drawing
        if (isDrawMode && e.button === 0 && !e.altKey) {
          e.preventDefault();
          const pt = getMousePosition(e);
          startDrawing(pt.x, pt.y);
          return;
        }
        
        if (e.button === 2 || e.button === 1 || (e.button === 0 && e.altKey)) {
          e.preventDefault();
          isPanning = true;
          panStartX = e.clientX;
          panStartY = e.clientY;
          panStartPanX = panX;
          panStartPanY = panY;
          svgEditor.style.cursor = 'grabbing';
        }
      });

      window.addEventListener('mousemove', (e) => {
        if (isPanning) {
          const CTM = svgEditor.getScreenCTM();
          const dx = (e.clientX - panStartX) / CTM.a;
          const dy = (e.clientY - panStartY) / CTM.d;
          panX = panStartPanX - dx;
          panY = panStartPanY - dy;
          updateViewBox();
          return;
        }
        
        // Draw mode: continue freehand drawing
        if (isDrawMode && isDrawing) {
          const pt = getMousePosition(e);
          continueDrawing(pt.x, pt.y);
        }
        
        handleDrag(e);
      });

      window.addEventListener('mouseup', (e) => {
        if (isPanning) {
          isPanning = false;
          svgEditor.style.cursor = '';
        }
        if (isDrawMode && isDrawing) {
          finishDrawing();
          return;
        }
        endDrag(e);
      });

      // Disable right-click context menu on editor
      svgEditor.addEventListener('contextmenu', (e) => e.preventDefault());

      // Touch gestures: 2-finger drag to pan & pinch to zoom
      let touchState = {
        startTouches: null,
        initialPanX: 0,
        initialPanY: 0,
        initialZoom: 1,
        initialDist: 0
      };

      function getTouchDist(t1, t2) {
        return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
      }
      function getTouchCenter(t1, t2) {
        return { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };
      }

      svgEditor.addEventListener('touchstart', (e) => {
        const touches = e.touches;
        // Point-place mode: single tap to add point
        if (touches.length === 1 && isPointPlaceMode) {
          e.preventDefault();
          const pt = getMousePosition(e);
          addPlacedPoint(pt.x, pt.y);
          return;
        }
        if (touches.length === 1 && isDrawMode) {
          e.preventDefault();
          const pt = getMousePosition(e);
          startDrawing(pt.x, pt.y);
          return;
        }
        if (touches.length === 2) {
          e.preventDefault();
          touchState.startTouches = [
            { x: touches[0].clientX, y: touches[0].clientY },
            { x: touches[1].clientX, y: touches[1].clientY }
          ];
          touchState.initialPanX = panX;
          touchState.initialPanY = panY;
          touchState.initialZoom = zoomLevel;
          touchState.initialDist = getTouchDist(touches[0], touches[1]);
        }
      }, { passive: false });

      window.addEventListener('touchmove', (e) => {
        const touches = e.touches;
        if (touches && touches.length === 2 && touchState.startTouches) {
          e.preventDefault();
          const CTM = svgEditor.getScreenCTM();
          
          const startCenter = {
            x: (touchState.startTouches[0].x + touchState.startTouches[1].x) / 2,
            y: (touchState.startTouches[0].y + touchState.startTouches[1].y) / 2
          };
          const curCenter = getTouchCenter(touches[0], touches[1]);
          const dx = (curCenter.x - startCenter.x) / CTM.a;
          const dy = (curCenter.y - startCenter.y) / CTM.d;
          
          const curDist = getTouchDist(touches[0], touches[1]);
          if (touchState.initialDist > 0) {
            const pinchRatio = curDist / touchState.initialDist;
            zoomLevel = Math.max(0.8, Math.min(6.0, touchState.initialZoom * pinchRatio));
          }
          
          panX = touchState.initialPanX - dx;
          panY = touchState.initialPanY - dy;
          updateViewBox();
          return;
        }
        // Draw mode: continue freehand
        if (isDrawMode && isDrawing && touches && touches.length === 1) {
          e.preventDefault();
          const pt = getMousePosition(e);
          continueDrawing(pt.x, pt.y);
          return;
        }
        handleDrag(e);
      }, { passive: false });

      window.addEventListener('touchend', (e) => {
        if (e.touches && e.touches.length < 2) {
          touchState.startTouches = null;
        }
        if (isDrawMode && isDrawing) {
          finishDrawing();
          return;
        }
        endDrag(e);
      });
      
      document.getElementById('prev-char-btn').addEventListener('click', () => navigateChar(-1));
      document.getElementById('next-char-btn').addEventListener('click', () => navigateChar(1));
      
      document.getElementById('undo-btn').addEventListener('click', undo);
      document.getElementById('redo-btn').addEventListener('click', redo);
      
      // Zoom Controls
      document.getElementById('zoom-in-btn').addEventListener('click', () => zoomAt(1.25));
      document.getElementById('zoom-out-btn').addEventListener('click', () => zoomAt(0.8));
      document.getElementById('zoom-reset-btn').addEventListener('click', resetZoom);
      
      const svgCont = document.getElementById('svg-container');
      svgCont.addEventListener('wheel', (e) => {
        e.preventDefault();
        const pt = getMousePosition(e);
        const factor = e.deltaY < 0 ? 1.15 : 0.85;
        zoomAt(factor, pt.x, pt.y);
      }, { passive: false });

      // Font Overlay Controls
      document.getElementById('font-overlay-btn').addEventListener('click', toggleFontOverlay);
      document.getElementById('chk-font-overlay').addEventListener('change', (e) => {
        fontOverlayActive = e.target.checked;
        updateFontOverlay();
      });

      const onFontParamChange = () => {
        fontOverlayActive = true;
        updateFontOverlay();
      };
      document.getElementById('font-select').addEventListener('change', onFontParamChange);
      document.getElementById('font-opacity').addEventListener('input', onFontParamChange);
      document.getElementById('font-size').addEventListener('input', onFontParamChange);
      document.getElementById('font-y').addEventListener('input', onFontParamChange);

      document.getElementById('btn-opacity-minus').addEventListener('click', () => stepFontSetting('font-opacity', -0.05));
      document.getElementById('btn-opacity-plus').addEventListener('click', () => stepFontSetting('font-opacity', 0.05));
      document.getElementById('btn-size-minus').addEventListener('click', () => stepFontSetting('font-size', -1));
      document.getElementById('btn-size-plus').addEventListener('click', () => stepFontSetting('font-size', 1));
      document.getElementById('btn-y-minus').addEventListener('click', () => stepFontSetting('font-y', -0.5));
      document.getElementById('btn-y-plus').addEventListener('click', () => stepFontSetting('font-y', 0.5));

      document.getElementById('toggle-move-mode').addEventListener('click', (e) => {
        isWholeMoveMode = !isWholeMoveMode;
        e.target.textContent = `全体移動: ${isWholeMoveMode ? 'ON' : 'OFF'}`;
        e.target.classList.toggle('active', isWholeMoveMode);
        // Mutual exclusion with rotate mode
        if (isWholeMoveMode && isRotateMode) {
          isRotateMode = false;
          pivotPoint = null;
          const rb = document.getElementById('toggle-rotate-mode');
          rb.textContent = '回転: OFF';
          rb.classList.remove('active');
          renderEditor();
        }
      });
      
      document.getElementById('toggle-rotate-mode').addEventListener('click', (e) => {
        isRotateMode = !isRotateMode;
        pivotPoint = null;
        e.target.textContent = isRotateMode ? '回転: ON (支点を選択)' : '回転: OFF';
        e.target.classList.toggle('active', isRotateMode);
        // Mutual exclusion with move mode
        if (isRotateMode && isWholeMoveMode) {
          isWholeMoveMode = false;
          const mb = document.getElementById('toggle-move-mode');
          mb.textContent = '全体移動: OFF';
          mb.classList.remove('active');
        }
        renderEditor();
      });
      
      document.getElementById('path-textarea').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          if (currentStrokeIndex >= 0) {
            try {
              parsedStrokes[currentStrokeIndex] = parseSvgPath(e.target.value);
              pushHistory();
              updateUI();
              showToast('パスを適用しました');
            } catch (err) {
              showToast('無効なパスです', true);
            }
          }
        }
      });
      
      document.getElementById('play-btn').addEventListener('click', playAnimation);
      document.getElementById('show-all-btn').addEventListener('click', () => {
        const paths = document.querySelectorAll('#preview-svg path');
        paths.forEach(p => {
          p.style.transition = 'none';
          p.style.strokeDasharray = 'none';
          p.style.strokeDashoffset = '0';
          p.style.display = 'block';
        });
      });
      document.getElementById('reset-btn').addEventListener('click', () => {
        const paths = document.querySelectorAll('#preview-svg path');
        paths.forEach(p => p.style.display = 'none');
      });
      
      document.getElementById('save-btn').addEventListener('click', () => saveCurrentChar(false));

      // ページ離脱時の安全対策（未保存の変更があれば警告）
      window.addEventListener('beforeunload', (e) => {
        if (!currentChar || !parsedStrokes || parsedStrokes.length === 0) return;
        const newPaths = parsedStrokes.map(s => buildSvgPath(s));
        const originalPaths = currentChar.paths || [];
        if (JSON.stringify(originalPaths) !== JSON.stringify(newPaths)) {
          e.preventDefault();
          e.returnValue = '';
        }
      });
      
      // Segment Operations
      document.getElementById('del-segment-btn').addEventListener('click', deleteSegment);
      document.getElementById('add-segment-btn').addEventListener('click', addSegment);
      
      // Auto-Fit
      document.getElementById('autofit-btn').addEventListener('click', autoFitFromFont);
      document.getElementById('check-fitness-btn').addEventListener('click', checkStrokeFitness);
      
      // Draw Mode
      document.getElementById('toggle-draw-mode').addEventListener('click', toggleDrawMode);
      document.getElementById('clear-stroke-btn').addEventListener('click', clearCurrentStroke);
      document.getElementById('clear-all-btn').addEventListener('click', clearAllStrokes);

      // Point Place Mode
      document.getElementById('toggle-point-mode').addEventListener('click', togglePointPlaceMode);
      document.getElementById('point-undo-btn').addEventListener('click', undoLastPoint);
      document.getElementById('point-confirm-btn').addEventListener('click', confirmPointPlacement);

      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
        
        // Point-place mode shortcuts
        if (isPointPlaceMode) {
          if (e.key === 'Escape') { exitPointPlaceMode(); return; }
          if (e.key === 'z' && e.ctrlKey) { e.preventDefault(); undoLastPoint(); return; }
          if (e.key === 'Enter') { e.preventDefault(); confirmPointPlacement(); return; }
          return; // Block other shortcuts in point mode
        }

        // Draw mode shortcuts
        if (isDrawMode) {
          if (e.key === 'Escape') { exitDrawMode(); return; }
          if (e.key === 'z' && e.ctrlKey) { e.preventDefault(); undo(); return; }
          return; // Block other shortcuts in draw mode
        }
        
        if (e.key === 'ArrowRight') navigateChar(1);
        if (e.key === 'ArrowLeft') navigateChar(-1);
        if (e.key === 'z' && e.ctrlKey) undo();
        if (e.key === 'y' && e.ctrlKey) redo();
        if (e.key === 'Delete') deleteSegment();
        if (e.key === 'Insert') addSegment();
        if (e.key === 'd' || e.key === 'D') toggleDrawMode();
        if (e.key === 'p' || e.key === 'P') togglePointPlaceMode();
      });
    }

    // Run
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
